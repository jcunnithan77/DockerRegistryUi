server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy registry API requests if they are not handled by a main reverse proxy
    location /v2 {
        proxy_pass http://registry:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering to allow large uploads/downloads if needed,
        # though this is mainly a read/delete manager UI.
        proxy_buffering off;
        
        # Support registry auth headers
        proxy_pass_header Authorization;
        
        # Pass Docker-Content-Digest and other headers back to client
        proxy_pass_header Docker-Content-Digest;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
